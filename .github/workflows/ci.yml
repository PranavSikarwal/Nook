name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Code Quality and Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nook
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nook"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          version: "0.11.25"

      - name: Set up Python
        run: uv python install 3.13

      - name: Create virtual environment and install root CI tools
        run: |
          uv venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          uv pip install --no-build --require-hashes -r .github/workflows/requirements.txt

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Run Cargo clippy
        run: |
          cd daemon
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Cargo tests
        env:
          NOOK_DATABASE_URL: postgresql://postgres:password@localhost:5432/nook
        run: |
          cd daemon
          cargo test --workspace

      - name: Run contract tests
        run: pytest tests/contracts

      - name: Set up Worker environment and run tests
        env:
          NOOK_DATABASE_URL: postgresql://postgres:password@localhost:5432/nook
        run: |
          cd worker
          uv venv
          uv pip install --no-build --require-hashes -r requirements.txt
          ./.venv/bin/pytest

      - name: Run repository-wide Pyright
        run: worker/.venv/bin/pyright

      - name: Install Ubuntu WebKit and Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Panel linter and build
        run: |
          cd panel
          npm ci --ignore-scripts
          npm run lint
          npm run build

      - name: Run Tauri cargo check
        run: |
          cd panel/src-tauri
          cargo check
