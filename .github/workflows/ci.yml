name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Code Quality and Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nook
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          enable-cache: true
          version: "0.11.25"

      - name: Set up Python
        run: uv python install 3.13

      - name: Create virtual environment and install root CI tools
        run: |
          uv venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          uv pip install --no-build --require-hashes -r .github/workflows/requirements.txt

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Run Cargo clippy
        run: |
          cd daemon
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Cargo tests
        env:
          NOOK_DATABASE_URL: postgresql://postgres@localhost:5432/nook
        run: |
          cd daemon
          cargo test --workspace

      - name: Run Pyright on model-check
        run: |
          cd model-check
          uv venv
          uv pip install --no-build --require-hashes -r requirements.txt
          pyright

      - name: Run Pyright on tests/contracts
        run: pyright tests/contracts

      - name: Run contract tests
        run: pytest tests/contracts

      - name: Run Worker tests and Pyright
        env:
          NOOK_DATABASE_URL: postgresql://postgres@localhost:5432/nook
        run: |
          cd worker
          uv venv
          uv pip install --no-build --require-hashes -r requirements.txt
          ./.venv/bin/pyright
          ./.venv/bin/pytest
