name: Package and Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-14
            args: ''
          - name: Ubuntu
            os: ubuntu-22.04
            args: ''
          - name: Windows
            os: windows-latest
            args: ''

    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Install Ubuntu WebKit dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Windows package inspection tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install lessmsi -y --no-progress
          choco install 7zip -y --no-progress

      - name: Build daemon binaries
        run: cargo build --manifest-path daemon/Cargo.toml --release --locked -p nookd -p nookctl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          version: "0.11.25"

      - name: Build Worker runtime
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            VENV_PYINSTALLER="worker/.venv/Scripts/pyinstaller.exe"
            WORKER_DIST="dist/release_entry"
            WORKER_EXE="dist/release_entry/release_entry"
            WORKER_RESOURCES="panel/src-tauri/resources/worker"
            DAEMON_EXE="daemon/target/release/nookd"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            VENV_PYINSTALLER="worker/.venv/bin/pyinstaller"
            WORKER_DIST="dist/release_entry"
            WORKER_EXE="dist/release_entry/release_entry"
            WORKER_RESOURCES="panel/src-tauri/resources/worker"
            DAEMON_EXE="daemon/target/release/nookd"
          else
            VENV_PYINSTALLER="worker/.venv/bin/pyinstaller"
            WORKER_DIST="dist/release_entry"
            WORKER_EXE="dist/release_entry/release_entry"
            WORKER_RESOURCES="panel/src-tauri/resources/worker"
            DAEMON_EXE="daemon/target/release/nookd"
          fi
          uv sync --project worker --locked --no-build --no-install-project --group dev
          if [ -x worker/.venv/bin/pyinstaller ]; then
            VENV_PYINSTALLER="worker/.venv/bin/pyinstaller"
          fi
          if [ -x worker/.venv/Scripts/pyinstaller.exe ]; then
            VENV_PYINSTALLER="worker/.venv/Scripts/pyinstaller.exe"
          fi
          test -x "$VENV_PYINSTALLER"
          "$VENV_PYINSTALLER" --noconfirm --clean --onedir --name release_entry --paths worker/src --distpath dist worker/src/nook_worker/release_entry.py
          test -f "$WORKER_EXE"

          mkdir -p "$WORKER_RESOURCES" panel/src-tauri/resources/daemon
          cp -R "$WORKER_DIST/." "$WORKER_RESOURCES/"
          cp "$DAEMON_EXE" panel/src-tauri/resources/daemon/
          mkdir -p panel/src-tauri/resources/policy
          cp -R policy/. panel/src-tauri/resources/policy/
          NOOK_SMOKE_EXECUTABLE="$WORKER_EXE" "$WORKER_EXE" --smoke-test

      - name: Build frontend
        run: |
          cd panel
          npm ci --ignore-scripts
          npm run build

      - name: Verify staged release runtimes
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f panel/src-tauri/resources/daemon/nookd.exe
            test -f panel/src-tauri/resources/worker/release_entry.exe
            test -f panel/src-tauri/resources/policy/tools.yaml
          else
            test -f panel/src-tauri/resources/daemon/nookd
            test -x panel/src-tauri/resources/worker/release_entry
            test -f panel/src-tauri/resources/policy/tools.yaml
          fi

      - name: Check staged policy with the staged daemon
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            NOOKD=nookd.exe
          else
            NOOKD=nookd
          fi
          RESOURCES="$PWD/panel/src-tauri/resources"
          POLICY_DIR="$RESOURCES/policy"
          if [ "$RUNNER_OS" = "Windows" ]; then
            POLICY_DIR="$(cygpath -w "$POLICY_DIR")"
          fi
          NOOK_POLICY_DIR="$POLICY_DIR" "$RESOURCES/daemon/$NOOKD" --check-policy
          LAYOUT_DIR="$(mktemp -d)"
          CHECK_CWD="$(mktemp -d)"
          cp -R "$RESOURCES/daemon" "$LAYOUT_DIR/daemon"
          cp -R "$RESOURCES/policy" "$LAYOUT_DIR/policy"
          cd "$CHECK_CWD"
          env -u NOOK_POLICY_DIR "$LAYOUT_DIR/daemon/$NOOKD" --check-policy

      - name: Start PostgreSQL for the approval check
        if: runner.os != 'Windows'
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install postgresql@16
            PG_BIN="$(brew --prefix postgresql@16)/bin"
            brew services start postgresql@16
            echo "$PG_BIN" >> "$GITHUB_PATH"
            export PATH="$PG_BIN:$PATH"
            echo "NOOK_PKG_DATABASE_URL=postgresql://$USER@localhost:5432/postgres" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y postgresql postgresql-client
            sudo systemctl start postgresql
            sudo -u postgres createuser --superuser "$USER"
            echo "NOOK_PKG_DATABASE_URL=postgresql:///postgres?host=/var/run/postgresql" >> "$GITHUB_ENV"
          fi
          for _ in $(seq 1 30); do
            pg_isready -q && break
            sleep 1
          done
          pg_isready

      - name: Run an approval through the staged Daemon and Worker
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 scripts/package-approval-check.py \
            --resources panel/src-tauri/resources \
            --database-url "$NOOK_PKG_DATABASE_URL"

      - name: Build and package Tauri app
        id: package
        continue-on-error: true
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.5.17
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: panel
          args: ${{ matrix.platform.args }}

      - name: Retry macOS DMG packaging
        if: runner.os == 'macOS' && steps.package.outcome == 'failure'
        shell: bash
        run: |
          rm -rf panel/src-tauri/target/release/bundle/dmg
          cd panel
          npm run tauri build

      - name: Fail an unrecovered package build
        if: runner.os != 'macOS' && steps.package.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Verify Windows MSI release runtimes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageRoot = 'panel/src-tauri/target/release/bundle'
          $msi = Get-ChildItem -Path $packageRoot -Recurse -Filter '*.msi' |
            Select-Object -First 1
          if ($null -eq $msi) {
            throw 'The Tauri build did not create an MSI package.'
          }

          $extractDir = Join-Path $env:RUNNER_TEMP 'nook-msi-extract'
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          $process = Start-Process -FilePath msiexec.exe -Wait -PassThru -ArgumentList @('/a', $msi.FullName, '/qn', "TARGETDIR=$extractDir")
          if ($process.ExitCode -ne 0) {
            throw "MSI administrative extraction failed with exit code $($process.ExitCode)."
          }

          $requiredFiles = @('nookd.exe', 'release_entry.exe')
          foreach ($requiredFile in $requiredFiles) {
            if ($null -eq (Get-ChildItem -Path $extractDir -Recurse -File -Filter $requiredFile |
              Select-Object -First 1)) {
              throw "The MSI does not contain $requiredFile."
            }
          }

      - name: Verify packaged release runtimes
        if: runner.os != 'Windows'
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            APP_PATH="$(find panel/src-tauri/target/release/bundle -name Nook.app -type d -print -quit)"
            test -n "$APP_PATH"
            test -f "$APP_PATH/Contents/Resources/daemon/nookd"
            test -x "$APP_PATH/Contents/Resources/worker/release_entry"
          else
            PACKAGE_ROOT="panel/src-tauri/target/release/bundle"
            DEB_PATH="$(find "$PACKAGE_ROOT" -type f -name '*.deb' -print -quit)"
            test -n "$DEB_PATH"
            EXTRACT_DIR="$(mktemp -d)"
            dpkg-deb -x "$DEB_PATH" "$EXTRACT_DIR"
            test -n "$(find "$EXTRACT_DIR" -type f -name nookd -print -quit)"
            test -n "$(find "$EXTRACT_DIR" -type f -name release_entry -print -quit)"
          fi

      - name: Stage standalone daemon assets
        shell: bash
        run: |
          OS_NAME="${{ matrix.platform.name }}"
          RUNNER_OS="${{ runner.os }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ARCH_NORM="x86_64"
            cp daemon/target/release/nookd.exe "nookd_${OS_NAME}_${ARCH_NORM}.exe"
            cp daemon/target/release/nookctl.exe "nookctl_${OS_NAME}_${ARCH_NORM}.exe"
          else
            ARCH_NAME="$(uname -m)"
            case "$ARCH_NAME" in
              aarch64|arm64) ARCH_NORM="arm64" ;;
              *) ARCH_NORM="x86_64" ;;
            esac
            cp daemon/target/release/nookd "nookd_${OS_NAME}_${ARCH_NORM}"
            cp daemon/target/release/nookctl "nookctl_${OS_NAME}_${ARCH_NORM}"
          fi

      - name: Upload verified package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform.name }}-${{ github.sha }}
          path: |
            panel/src-tauri/target/release/bundle/**
            nookd_*
            nookctl_*
          if-no-files-found: error
          retention-days: 7
