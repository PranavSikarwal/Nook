name: Package and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-14
            args: ''
          - name: Ubuntu
            os: ubuntu-22.04
            args: ''
          - name: Windows
            os: windows-latest
            args: ''

    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master

      - name: Install Ubuntu WebKit dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node scripts/sync-version.js "$TAG_NAME"

      - name: Build frontend
        run: |
          cd panel
          npm ci --ignore-scripts
          npm run build

      - name: Build and package Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.5.17
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: panel
          tagName: ${{ github.ref_name }}
          releaseName: 'Nook ${{ github.ref_name }}'
          releaseBody: 'Nook cross-platform overlay assistant for macOS, Ubuntu Linux, and Windows.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform.args }}
