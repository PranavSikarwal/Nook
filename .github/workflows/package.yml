name: Package and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-14
            args: ''
          - name: Ubuntu
            os: ubuntu-22.04
            args: ''
          - name: Windows
            os: windows-latest
            args: ''

    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Ubuntu WebKit dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Build frontend
        run: |
          cd panel
          npm ci || npm install
          npm run build

      - name: Build and package Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: panel
          tagName: ${{ github.ref_name }}
          releaseName: 'Nook ${{ github.ref_name }}'
          releaseBody: 'Nook cross-platform overlay assistant for macOS, Ubuntu Linux, and Windows.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform.args }}
