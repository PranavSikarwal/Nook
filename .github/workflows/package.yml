name: Package and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-14
            args: ''
          - name: Ubuntu
            os: ubuntu-22.04
            args: ''
          - name: Windows
            os: windows-latest
            args: ''

    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Install Ubuntu WebKit dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Require a changelog entry for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          awk -v heading="## ${TAG_NAME}" '$0 == heading { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md must contain a non-empty section for ${TAG_NAME}." >&2
            exit 1
          fi

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node scripts/sync-version.js "$TAG_NAME"

      - name: Build daemon binaries
        if: matrix.platform.os != 'windows-latest'
        run: |
          cd daemon
          cargo build --release --locked -p nookd -p nookctl

      - name: Build frontend
        run: |
          cd panel
          npm ci --ignore-scripts
          npm run build

      - name: Build and package Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.5.17
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: panel
          tagName: ${{ github.ref_name }}
          releaseName: 'Nook ${{ github.ref_name }}'
          releaseBody: 'Release notes are published from CHANGELOG.md after all platform builds finish.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform.args }}

      - name: Upload standalone daemon assets
        if: matrix.platform.os != 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          OS_NAME="${{ matrix.platform.name }}"
          ARCH_NAME="$(uname -m)"
          case "$ARCH_NAME" in
            aarch64|arm64) ARCH_NORM="arm64" ;;
            *) ARCH_NORM="x86_64" ;;
          esac
          cp daemon/target/release/nookd "nookd_${OS_NAME}_${ARCH_NORM}"
          cp daemon/target/release/nookctl "nookctl_${OS_NAME}_${ARCH_NORM}"
          gh release upload "$TAG_NAME" "nookd_${OS_NAME}_${ARCH_NORM}" "nookctl_${OS_NAME}_${ARCH_NORM}" --clobber

  publish-release-notes:
    name: Publish changelog entry
    needs: build-and-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged changelog
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Extract release notes
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          awk -v heading="## ${TAG_NAME}" '$0 == heading { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog notes found for ${TAG_NAME}." >&2
            exit 1
          fi

      - name: Update GitHub release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release edit "$TAG_NAME" --notes-file release-notes.md
