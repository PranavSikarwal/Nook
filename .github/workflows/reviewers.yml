name: Manual PR reviewers

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code_review:
    name: Reviewer (Code review)
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/code-review') && !startsWith(github.event.comment.body, '/code-review-expert')) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'code-review')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Run code review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEWER_BASE_URL: ${{ secrets.REVIEWER_BASE_URL || secrets.NOOK_BASE_URL }}
          REVIEWER_API_KEY: ${{ secrets.REVIEWER_API_KEY || secrets.NOOK_API_KEY }}
          REVIEWER_MODEL: ${{ secrets.REVIEWER_MODEL || secrets.NOOK_MODEL }}
        run: |
          uv run --with openai python scripts/pr_reviewer.py --mode code-review

  code_review_expert:
    name: Reviewer (Code review expert)
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/code-review-expert')) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'code-review-expert')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Run expert review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEWER_BASE_URL: ${{ secrets.REVIEWER_BASE_URL || secrets.NOOK_BASE_URL }}
          REVIEWER_API_KEY: ${{ secrets.REVIEWER_API_KEY || secrets.NOOK_API_KEY }}
          REVIEWER_MODEL: ${{ secrets.REVIEWER_MODEL || secrets.NOOK_MODEL }}
        run: |
          uv run --with openai python scripts/pr_reviewer.py --mode code-review-expert

  feedback_on_resolution:
    name: Reviewer (Feedback on resolution)
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/feedback-on-resolution')) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'feedback-on-resolution')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Run resolution check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEWER_BASE_URL: ${{ secrets.REVIEWER_BASE_URL || secrets.NOOK_BASE_URL }}
          REVIEWER_API_KEY: ${{ secrets.REVIEWER_API_KEY || secrets.NOOK_API_KEY }}
          REVIEWER_MODEL: ${{ secrets.REVIEWER_MODEL || secrets.NOOK_MODEL }}
        run: |
          uv run --with openai python scripts/pr_reviewer.py --mode feedback-on-resolution
